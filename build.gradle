
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.cookiecat'
version = '1.0.0'

base {
    archivesName = 'blaze-caster-no-player-targeting'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Repository used to download Create: Wizardry for compilation.
repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

neoForge {
    version = '21.1.262'

    runs {
        server {
            server()
            gameDirectory = project.file('run')
        }
    }

    mods {
        blaze_caster_no_player_targeting {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Make Create: Wizardry available to Java while compiling.
    // compileOnly prevents its classes from being bundled into our mod.
    compileOnly 'maven.modrinth:OeGdeWEj:K1xkNKKf'

    // Mixin annotations and annotation processor.
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
