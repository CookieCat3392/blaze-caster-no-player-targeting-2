
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.cookiecat'
version = '1.0.0'

base {
    archivesName = 'blaze-caster-no-player-targeting'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    // Modrinth Maven repository
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }

    // Create and Ponder Maven repository
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
}

neoForge {
    version = '21.1.262'

    runs {
        server {
            server()
            gameDirectory = project.file('run')
        }
    }

    mods {
        blaze_caster_no_player_targeting {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Create 6.0.10
    compileOnly 'maven.modrinth:LNytGWDc:UjX6dr61'

    // Create: Wizardry 1.21.1-0.5.1-pre1
    compileOnly 'maven.modrinth:OeGdeWEj:K1xkNKKf'

    // Ponder, required by Create's SmartBlockEntity
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'

    // Mixin annotations and annotation processor
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
